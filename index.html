<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<title>💖 Болзох уу?</title>
<style>
    body {
        font-family: Arial, sans-serif;
        text-align: center;
        background: #ffe6f0;
        margin: 0;
        height: 100vh;

        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
    }

    h1 {
        font-size: 40px;
    }

    .btn {
        padding: 15px 30px;
        font-size: 20px;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        margin: 10px;
        transition: 0.3s;
    }

    #yes {
        background: #ff4da6;
        color: white;
    }

    #no {
        background: #ccc;
    }

    /* GIF контейнер */
    .gif-container {
        display: flex;
        justify-content: center;
        align-items: center;
        margin-top: 20px;
    }

    img {
        width: 200px;
        display: none;
    }

</style>
</head>
<body>

<h1>😏 Чи хөөрхөн үү?</h1>

<div>
    <button id="yes" class="btn">Тийм ❤️</button>
    <button id="no" class="btn">Үгүй 😢</button>
</div>

<div class="gif-container">
    <img id="gif" src="">
</div>

<h2 id="message"></h2>

<script>
let noCount = 0;

const yesBtn = document.getElementById("yes");
const noBtn = document.getElementById("no");
const gif = document.getElementById("gif");
const message = document.getElementById("message");

noBtn.addEventListener("click", () => {
    noCount++;

    let size = 20 + noCount * 10;
    yesBtn.style.fontSize = size + "px";

    gif.style.display = "block";
    gif.src = "https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExYzRlOHFrZmJmZDBrbmJqOWl1NGViNzlsNnNhdDJtcGVndzF5ZG94NyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/rCxogJBzaeZuU/giphy.gif";

    message.innerText = "Дахиад боддоо... 😢";
});

yesBtn.addEventListener("click", () => {
    gif.style.display = "block";
    gif.src = "https://media0.giphy.com/media/v1.Y2lkPTc5MGI3NjExbHppZnlhNXhkcHZncHp5eWhpdjdhOWVxM3FuaWs3eG9rZ2k4aDJiMiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/7y4Nc95399hsr24oYc/giphy.gif";

    message.innerHTML = `
        😍 Би мэдэж байсан! <br><br>
        💖 Хамгийн хөөрхөн нь чи шүү!
    `;

    noBtn.style.display = "none";
});
</script>

</body>
</html>
