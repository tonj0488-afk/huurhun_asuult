<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💖 Чи мэдэх үү?</title>

<style>
body{
    margin:0;
    width:100vw;
    height:100vh;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ffd6e7,#fff0f6);
    font-family:Arial,sans-serif;
    text-align:center;
}

h1{
    color:#ff1493;
    margin-bottom:25px;
}

.btn{
    padding:15px 30px;
    font-size:20px;
    border:none;
    border-radius:12px;
    cursor:pointer;
    margin:10px;
    transition:0.2s;
}

#yes{
    background:#ff4da6;
    color:white;
}

#no{
    background:#d9d9d9;
    position:fixed;
}

#gif{
    width:250px;
    margin-top:20px;
    display:none;
    border-radius:15px;
}

.credit{
    position:fixed;
    bottom:10px;
    right:15px;
    font-size:14px;
    color:#ff69b4;
    opacity:0.7;
}

.heart{
    position:fixed;
    font-size:30px;
    pointer-events:none;
    animation:floatUp 2s linear forwards;
}

@keyframes floatUp{
    from{transform:translateY(0); opacity:1;}
    to{transform:translateY(-250px); opacity:0;}
}
</style>
</head>

<body>

<div id="app">
    <h1 id="question">🥰 Toogii чамайг хөөрхөн гэж боддог уу?</h1>

    <div id="buttons">
        <button id="yes" class="btn">Тийм ❤️</button>
        <button id="no" class="btn">Үгүй 😢</button>
    </div>

    <img id="gif">
</div>

<div class="credit">Made by Toogii 💖</div>

<script>

const yesBtn = document.getElementById("yes");
const noBtn = document.getElementById("no");
const gif = document.getElementById("gif");
const question = document.getElementById("question");

let noCount = 0;

const texts = [
    "🥺 Итгэлтэй байна уу?",
    "😭 Дахиад боддоо...",
    "💔 Үнэхээр үү?",
    "😢 Би гомдчихлоо...",
    "🥹 За битгий дээ...",
    "😏 Тийм дээр дараач...",
    "😂 Барьж чадвал дар даа..."
];

// NO button move
noBtn.addEventListener("mouseover", () => {

    noCount++;

    const btnWidth = noBtn.offsetWidth;
    const btnHeight = noBtn.offsetHeight;

    const maxX = window.innerWidth - btnWidth - 20;
    const maxY = window.innerHeight - btnHeight - 20;

    noBtn.style.left = Math.random() * maxX + "px";
    noBtn.style.top = Math.random() * maxY + "px";
    noBtn.style.zIndex = "9999";

    yesBtn.style.fontSize = (20 + noCount * 4) + "px";

    question.innerText = texts[Math.min(noCount - 1, texts.length - 1)];

    gif.style.display = "block";
    gif.src = "https://media1.giphy.com/media/rCxogJBzaeZuU/giphy.gif";
});


// YES click → new mini screen with YES/NO again
yesBtn.addEventListener("click", () => {

    document.getElementById("app").innerHTML = `
        <h1>😍 Яаааай!</h1>

        <img src="https://media.giphy.com/media/7y4Nc95399hsr24oYc/giphy.gif"
        style="width:250px;border-radius:20px;">

        <h2 style="color:#ff1493;">
            💖 Би мэдэж байсан! 💖<br>
            Чи хамгийн хөөрхөн 😘<br><br>
            Дараа уулзахдаа болзох уу? 🥰
        </h2>

        <div>
            <button id="againYes" class="btn" style="background:#ff4da6;color:white;">Тийм ❤️</button>
            <button id="againNo" class="btn">Үгүй 😢</button>
        </div>
    `;

    // YES again
    document.getElementById("againYes").addEventListener("click", () => {
        alert("😏 Чи аль хэдийн тийм гэж хэлсэн шүү 💖");
    });

    // NO again → reset
    document.getElementById("againNo").addEventListener("click", () => {
        location.reload();
    });

    // hearts animation
    setInterval(() => {
        const heart = document.createElement("div");
        heart.className = "heart";
        heart.innerHTML = "❤️";
        heart.style.left = Math.random() * window.innerWidth + "px";
        heart.style.top = window.innerHeight + "px";

        document.body.appendChild(heart);

        setTimeout(() => heart.remove(), 2000);
    }, 150);
});

</script>

</body>
</html>
